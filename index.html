<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Target 1900 Typing</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Target 1900 Typing</h1>

  <section class="controls">
    <label>from <input id="from" type="number" min="1" max="1900" value="1"></label>
    <span>–</span>
    <label>to <input id="to" type="number" min="1" max="1900" value="100"></label>
    <button id="start">start</button>
  </section>

  <section id="game" hidden>
    <div id="progress"></div>
    <div id="meaning"></div>
    <div id="word"></div>
    <input id="answer" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div id="hint"></div>
  </section>

  <section id="result" hidden>
    <div id="score"></div>
    <button id="retry">もう一度トライ</button>
    <div id="mistakeTitle">ミスした単語</div>
    <div id="mistakes"></div>
  </section>
</main>
<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
